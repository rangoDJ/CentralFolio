services:
  app:
    image: ghcr.io/rangodj/centralfolio:latest
    build: .
    container_name: centralfolio-app
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - DATA_DIR=/data
      - LOG_LEVEL=info
      - NODE_ENV=production
    restart: unless-stopped
    # A hung process still answers TCP, so probe a real endpoint. /auth/status
    # needs no session and touches the database.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    # The app never needs to escalate privileges.
    security_opt:
      - no-new-privileges:true
